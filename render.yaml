# Import only after the workspace, repository, region and billing plan are approved.
services:
  - type: web
    name: peyajflow-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: /app/.venv/bin/python -m app.migrate
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: peyajflow-db
          property: connectionString
      - key: PHOTO_STORAGE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: TELEPHONY_PROVIDER
        value: disabled
      - key: SMS_PROVIDER
        value: disabled
databases:
  - name: peyajflow-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
