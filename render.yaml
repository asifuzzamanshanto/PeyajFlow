# Free application service. Supply the dedicated Supabase PostgreSQL and S3 settings.
services:
  - type: web
    name: peyajflow-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /app/start-hosted.sh
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PHOTO_STORAGE
        value: s3
      - key: S3_BUCKET
        value: inspections
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SHOWCASE_ACCESS_KEY
        sync: false
      - key: TELEPHONY_PROVIDER
        value: disabled
      - key: SMS_PROVIDER
        value: disabled
