[project]
name = "peyajflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.129,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.40,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.5,<3",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
