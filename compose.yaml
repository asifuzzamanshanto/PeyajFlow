services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peyajflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peyajflow-local}
      POSTGRES_DB: ${POSTGRES_DB:-peyajflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./services/api
    command: ["python", "-m", "app.migrate"]
    environment: &api-environment
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-peyajflow}:${POSTGRES_PASSWORD:-peyajflow-local}@db:5432/${POSTGRES_DB:-peyajflow}"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./services/api
    environment:
      <<: *api-environment
      APP_ENV: development
      DEMO_MODE: "true"
      PHOTO_STORAGE: local
      PHOTO_DIR: /var/lib/peyajflow/photos
    volumes:
      - inspection-photos:/var/lib/peyajflow/photos
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  inspection-photos:
